
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ESP32 Wi-Fi Manager</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --pink: #e96b9b;
    --pink-dark: #c94f80;
    --pink-light: #fce4ee;
    --lavender: #a98bd4;
    --cream: #fff9fc;
    --text: #493344;
    --text-dark: #352431;
    --muted: #987f8e;
    --border: rgba(216,91,136,0.18);
}

body {
    min-height: 100vh;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 10% 10%, rgba(233,107,155,0.16), transparent 30%),
        radial-gradient(circle at 90% 5%, rgba(169,139,212,0.17), transparent 27%),
        #fff8fb;
    color: var(--text);
    font-family: "JetBrains Mono", monospace;
}

.wifi-page {
    width: 100%;
    max-width: 570px;
}

.wifi-card {
    position: relative;
    overflow: hidden;
    padding: 35px;
    background: rgba(255,255,255,0.94);
    border: 1px solid var(--border);
    border-radius: 26px;
    box-shadow: 0 18px 50px rgba(157,85,119,0.14);
}

.wifi-card::before {
    content: "♡";
    position: absolute;
    right: 20px;
    top: -55px;
    font: 180px Arial, sans-serif;
    color: rgba(233,107,155,0.06);
}

.wifi-icon {
    position: relative;
    width: 55px;
    height: 55px;
    display: grid;
    place-items: center;
    margin-bottom: 18px;
    color: white;
    background: linear-gradient(135deg, var(--pink), var(--lavender));
    border-radius: 17px;
    font: 24px Arial, sans-serif;
    box-shadow: 0 10px 25px rgba(216,91,136,0.22);
}

.system-label {
    position: relative;
    color: var(--pink);
    font-size: 8px;
    letter-spacing: 2px;
    font-weight: 700;
}

h1 {
    position: relative;
    margin-top: 8px;
    color: var(--text-dark);
    font: 700 29px Orbitron, sans-serif;
}

.wifi-description {
    position: relative;
    margin-top: 10px;
    color: var(--muted);
    font-size: 9px;
    line-height: 1.7;
}

form {
    position: relative;
    margin-top: 28px;
}

.wifi-field {
    margin-bottom: 18px;
}

.wifi-field label {
    display: block;
    margin-bottom: 7px;
    color: #9b8190;
    font-size: 8px;
    letter-spacing: 1.5px;
}

.wifi-field input {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border: 1px solid rgba(216,91,136,0.30);
    border-radius: 13px;
    outline: none;
    background: #fffafd;
    color: var(--pink-dark);
    font: 600 11px "JetBrains Mono", monospace;
}

.wifi-field input:focus {
    border-color: var(--pink);
    box-shadow: 0 0 0 3px rgba(233,107,155,0.10);
}

.wifi-field input::placeholder {
    color: #b79cab;
}

.wifi-submit {
    width: 100%;
    height: 49px;
    border: 1px solid var(--pink);
    border-radius: 13px;
    background: linear-gradient(135deg, var(--pink), var(--pink-dark));
    color: white;
    cursor: pointer;
    font: 700 9px "JetBrains Mono", monospace;
    letter-spacing: 1px;
    box-shadow: 0 10px 25px rgba(216,91,136,0.18);
}

.wifi-submit:hover {
    transform: translateY(-2px);
}

.wifi-note {
    position: relative;
    margin-top: 20px;
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: #fff4f8;
    color: var(--muted);
    font-size: 8px;
    line-height: 1.7;
}

.wifi-note strong {
    color: var(--pink-dark);
}

.back-link {
    position: relative;
    display: inline-block;
    margin-top: 20px;
    color: var(--pink-dark);
    text-decoration: none;
    font-size: 8px;
    letter-spacing: 1px;
}

.back-link:hover {
    color: var(--lavender);
}

@media (max-width: 600px) {
    body {
        padding: 12px;
    }

    .wifi-card {
        padding: 25px 20px;
    }

    h1 {
        font-size: 24px;
    }
}
</style>

</head>

<body>

<div class="wifi-page">

    <div class="wifi-card">

        <div class="wifi-icon">
            ♡
        </div>

        <div class="system-label">
            ESP32 / NETWORK CONFIGURATION
        </div>

        <h1>
            Wi-Fi Manager
        </h1>

        <p class="wifi-description">
            Enter your Wi-Fi credentials below.
            The ESP32 will save them automatically.
        </p>

        <form
            action="/savewifi"
            method="POST"
        >

            <div class="wifi-field">

                <label for="ssid">
                    WI-FI SSID
                </label>

                <input
                    type="text"
                    id="ssid"
                    name="ssid"
                    placeholder="Enter Wi-Fi name"
                    required
                >

            </div>

            <div class="wifi-field">

                <label for="password">
                    WI-FI PASSWORD
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Wi-Fi password"
                    required
                >

            </div>

            <button
                type="submit"
                class="wifi-submit"
            >
                ♡ SAVE & CONNECT
            </button>

        </form>

        <div class="wifi-note">
            <strong>Note:</strong>
            The ESP32 saves the Wi-Fi credentials
            in LittleFS memory.
        </div>

        <a
            href="/"
            class="back-link"
        >
            ← BACK TO DASHBOARD
        </a>

    </div>

</div>

</body>
</html>
